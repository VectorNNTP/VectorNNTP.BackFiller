name: Code Coverage

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test and Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK (repo pin)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install .NET 8 runtime
        shell: bash
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --runtime dotnet --version 8.0.31 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Verify SDK and runtime selection
        shell: bash
        run: |
          dotnet --version
          dotnet --list-runtimes | grep "Microsoft.NETCore.App 8.0.31"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        timeout-minutes: 10
        run: >
          dotnet test VectorNNTP.BackFiller.Tests/VectorNNTP.BackFiller.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: >
          reportgenerator
          "-reports:TestResults/**/coverage.cobertura.xml"
          "-targetdir:TestResults/CoverageReport"
          "-reporttypes:Html;Cobertura;TextSummary"

      - name: Display coverage summary
        run: cat TestResults/CoverageReport/Summary.txt

      - name: Add coverage summary to GitHub
        shell: bash
        run: |
          {
            echo "## Code Coverage"
            echo
            echo '```text'
            cat TestResults/CoverageReport/Summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: TestResults/CoverageReport/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14
