name: Code Coverage

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test and Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set expected SDK version from global.json
        shell: bash
        run: |
          EXPECTED_SDK_VERSION="$(python3 -c "import json; print(json.load(open('global.json', encoding='utf-8'))['sdk']['version'])")"
          echo "EXPECTED_SDK_VERSION=$EXPECTED_SDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup .NET SDK (repo pin)
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install .NET 8 runtime into setup-dotnet root
        shell: bash
        run: |
          BEFORE_DOTNET_PATH="$(command -v dotnet)"
          BEFORE_DOTNET_REALPATH="$(readlink -f "$BEFORE_DOTNET_PATH")"
          echo "setup-dotnet resolved SDK version: ${{ steps.setup-dotnet.outputs.dotnet-version }}"
          echo "DOTNET_INSTALL_DIR=$DOTNET_INSTALL_DIR"
          echo "DOTNET_ROOT=${DOTNET_ROOT:-<unset>}"
          echo "Before runtime install dotnet path: $BEFORE_DOTNET_PATH"
          echo "Before runtime install dotnet realpath: $BEFORE_DOTNET_REALPATH"
          test -d "$DOTNET_INSTALL_DIR/sdk/$EXPECTED_SDK_VERSION"
          DOTNET_INSTALL_SCRIPT="$RUNNER_TEMP/dotnet-install.sh"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$DOTNET_INSTALL_SCRIPT"
          chmod +x "$DOTNET_INSTALL_SCRIPT"
          "$DOTNET_INSTALL_SCRIPT" --runtime dotnet --version 8.0.31 --install-dir "$DOTNET_INSTALL_DIR" --skip-non-versioned-files
          "$DOTNET_INSTALL_SCRIPT" --runtime aspnetcore --version 8.0.31 --install-dir "$DOTNET_INSTALL_DIR" --skip-non-versioned-files
          AFTER_DOTNET_PATH="$(command -v dotnet)"
          AFTER_DOTNET_REALPATH="$(readlink -f "$AFTER_DOTNET_PATH")"
          echo "After runtime install dotnet path: $AFTER_DOTNET_PATH"
          echo "After runtime install dotnet realpath: $AFTER_DOTNET_REALPATH"
          test "$BEFORE_DOTNET_PATH" = "$AFTER_DOTNET_PATH"
          test "$BEFORE_DOTNET_REALPATH" = "$AFTER_DOTNET_REALPATH"

      - name: Verify SDK and runtime selection
        shell: bash
        run: |
          command -v dotnet
          readlink -f "$(command -v dotnet)"
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes
          dotnet --list-sdks | grep "$EXPECTED_SDK_VERSION"
          dotnet --list-runtimes | grep "Microsoft.NETCore.App 8.0.31"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        timeout-minutes: 10
        run: >
          dotnet test VectorNNTP.BackFiller.Tests/VectorNNTP.BackFiller.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: >
          reportgenerator
          "-reports:TestResults/**/coverage.cobertura.xml"
          "-targetdir:TestResults/CoverageReport"
          "-reporttypes:Html;Cobertura;TextSummary"

      - name: Display coverage summary
        run: cat TestResults/CoverageReport/Summary.txt

      - name: Add coverage summary to GitHub
        shell: bash
        run: |
          {
            echo "## Code Coverage"
            echo
            echo '```text'
            cat TestResults/CoverageReport/Summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: TestResults/CoverageReport/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14
