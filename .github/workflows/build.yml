name: Build and Validate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-test:
    name: Linux Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore VectorNNTP.BackFiller.slnx

      - name: Build production project
        run: dotnet build VectorNNTP.BackFiller/VectorNNTP.BackFiller.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build VectorNNTP.BackFiller.Tests/VectorNNTP.BackFiller.Tests.csproj --configuration Release --no-restore

      - name: Run tests (with hang diagnostics)
        # TEMPORARY: normal Linux tests are currently known to fail/hang; keep them running for visibility/diagnostics while this gate is non-blocking until suite stabilization restores blocking enforcement.
        continue-on-error: true
        shell: bash
        run: |
          set -u
          DIAG_DIR="./TestResults/diagnostics"
          LOG_FILE="$DIAG_DIR/test-output.log"
          mkdir -p "$DIAG_DIR"

          INACTIVITY_TIMEOUT_SECONDS=480
          CHECK_INTERVAL_SECONDS=15
          WATCHDOG_KILL_GRACE_SECONDS=20

          list_descendants() {
            local parent="$1"
            local children
            children=$(pgrep -P "$parent" 2>/dev/null || true)
            if [ -n "$children" ]; then
              while IFS= read -r child; do
                [ -n "$child" ] || continue
                echo "$child"
                list_descendants "$child"
              done <<< "$children"
            fi
          }

          list_test_tree_pids() {
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "$test_pid"
            fi
            list_descendants "$test_pid"
          }

          is_test_tree_alive() {
            local pids pid
            pids=$(list_test_tree_pids | sort -u)
            while IFS= read -r pid; do
              [ -n "$pid" ] || continue
              if kill -0 "$pid" 2>/dev/null; then
                return 0
              fi
            done <<< "$pids"
            return 1
          }

          capture_diagnostics() {
            local trigger_reason="$1"
            {
              echo "Trigger: $trigger_reason"
              echo "UTC timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              echo "watchdog pid: ${watchdog_pid:-unknown}"
              echo "watchdog pgid: ${watchdog_pgid:-unknown}"
              echo "dotnet test pid: $test_pid"
              echo "dotnet test pgid: ${test_pgid:-unknown}"
              echo "process-group termination safe: ${process_group_termination_safe:-unknown}"
              echo "termination strategy: ${termination_strategy:-unknown}"
            } | tee "$DIAG_DIR/hang-summary.txt"

            ps -eo pid,ppid,pgid,sid,stat,etime,cmd > "$DIAG_DIR/ps-all.txt" || true
            ps -eLf > "$DIAG_DIR/ps-threads.txt" || true
            pgrep -a dotnet > "$DIAG_DIR/pgrep-dotnet.txt" || true

            if command -v pstree >/dev/null 2>&1; then
              pstree -ap > "$DIAG_DIR/pstree.txt" || true
            fi

            mapfile -t tree_pids < <(list_test_tree_pids | sort -u)
            mapfile -t runtime_pids < <(pgrep -f "dotnet|testhost|vstest" | sort -u)
            mapfile -t candidate_pids < <(printf "%s\n%s\n" "${tree_pids[*]}" "${runtime_pids[*]}" | tr ' ' '\n' | sed '/^$/d' | sort -u)

            for pid in "${candidate_pids[@]}"; do
              proc_dir="$DIAG_DIR/proc-$pid"
              mkdir -p "$proc_dir"
              cat "/proc/$pid/cmdline" 2>/dev/null | tr '\0' ' ' > "$proc_dir/cmdline.txt" || true
              cat "/proc/$pid/status" > "$proc_dir/status.txt" 2>/dev/null || true
              cat "/proc/$pid/stack" > "$proc_dir/stack.txt" 2>/dev/null || true
              cat "/proc/$pid/wchan" > "$proc_dir/wchan.txt" 2>/dev/null || true
              cat "/proc/$pid/limits" > "$proc_dir/limits.txt" 2>/dev/null || true
            done

            if command -v dotnet-dump >/dev/null 2>&1; then
              mkdir -p "$DIAG_DIR/dumps"
              for pid in "${candidate_pids[@]}"; do
                dotnet-dump collect -p "$pid" -o "$DIAG_DIR/dumps/dotnet-$pid.dmp" > "$DIAG_DIR/dotnet-dump-$pid.log" 2>&1 || true
              done
            else
              echo "dotnet-dump not found on runner." > "$DIAG_DIR/dotnet-dump-unavailable.txt"
            fi
          }

          terminate_test_tree() {
            local signal_name="$1"
            if [ "${use_process_group_termination:-0}" -eq 1 ]; then
              kill "-$signal_name" -- "-$test_pgid" 2>/dev/null || true
            else
              local pid
              while IFS= read -r pid; do
                [ -n "$pid" ] || continue
                kill "-$signal_name" "$pid" 2>/dev/null || true
              done < <(list_test_tree_pids | sort -u)
            fi
          }

          watchdog_pid=$$
          watchdog_pgid=$(ps -o pgid= -p "$watchdog_pid" 2>/dev/null | tr -d ' ')

          dotnet test VectorNNTP.BackFiller.Tests/VectorNNTP.BackFiller.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults > "$LOG_FILE" 2>&1 &
          test_pid=$!
          test_pgid=$(ps -o pgid= -p "$test_pid" 2>/dev/null | tr -d ' ')

          use_process_group_termination=0
          process_group_termination_safe=false
          termination_strategy="descendant-pids"
          if [ -n "${test_pgid:-}" ] && [ -n "${watchdog_pgid:-}" ] && [ "$test_pgid" != "$watchdog_pgid" ] && [ "$test_pgid" != "$watchdog_pid" ]; then
            use_process_group_termination=1
            process_group_termination_safe=true
            termination_strategy="process-group"
          fi

          trap 'echo "[watchdog] received termination signal"; terminate_test_tree TERM' INT TERM

          last_change_epoch=$(date +%s)
          if [ -f "$LOG_FILE" ]; then
            last_size=$(wc -c < "$LOG_FILE")
          else
            last_size=0
          fi

          hang_detected=0
          last_reported_idle_bucket=-1

          echo "[watchdog] monitoring test pid=$test_pid pgid=${test_pgid:-unknown} watchdog_pid=${watchdog_pid:-unknown} watchdog_pgid=${watchdog_pgid:-unknown} timeout=${INACTIVITY_TIMEOUT_SECONDS}s interval=${CHECK_INTERVAL_SECONDS}s strategy=${termination_strategy}"

          while is_test_tree_alive; do
            sleep "$CHECK_INTERVAL_SECONDS"
            if [ -f "$LOG_FILE" ]; then
              current_size=$(wc -c < "$LOG_FILE")
            else
              current_size=0
            fi

            if [ "$current_size" -ne "$last_size" ]; then
              last_size="$current_size"
              last_change_epoch=$(date +%s)
            fi

            now_epoch=$(date +%s)
            idle_seconds=$((now_epoch - last_change_epoch))

            idle_bucket=$((idle_seconds / 60))
            if [ "$idle_bucket" -ne "$last_reported_idle_bucket" ]; then
              tree_count=$(list_test_tree_pids | sort -u | sed '/^$/d' | wc -l)
              echo "[watchdog] test tree alive (pids=$tree_count), output idle=${idle_seconds}s"
              last_reported_idle_bucket="$idle_bucket"
            fi

            if [ "$idle_seconds" -ge "$INACTIVITY_TIMEOUT_SECONDS" ]; then
              hang_detected=1
              break
            fi
          done

          if [ "$hang_detected" -eq 1 ]; then
            capture_diagnostics "Inactivity threshold exceeded: ${INACTIVITY_TIMEOUT_SECONDS}s"
            echo "[watchdog] sending TERM to test process tree"
            terminate_test_tree TERM

            grace_deadline=$(( $(date +%s) + WATCHDOG_KILL_GRACE_SECONDS ))
            while is_test_tree_alive; do
              if [ "$(date +%s)" -ge "$grace_deadline" ]; then
                break
              fi
              sleep 1
            done

            if is_test_tree_alive; then
              echo "[watchdog] test process tree still alive after ${WATCHDOG_KILL_GRACE_SECONDS}s, sending KILL"
              terminate_test_tree KILL
            fi
          fi

          wait "$test_pid"
          test_exit=$?

          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          fi

          if [ "$hang_detected" -eq 1 ]; then
            exit 124
          fi

          exit "$test_exit"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-results
          path: TestResults/**/*.trx
          retention-days: 14

      - name: Upload Linux test hang diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-test-hang-diagnostics
          path: TestResults/diagnostics/**
          retention-days: 14

  linux-benchmark-tests:
    name: Linux Benchmark Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore VectorNNTP.BackFiller.slnx

      - name: Build benchmark project
        run: dotnet build VectorNNTP.BackFiller.Benchmarks/VectorNNTP.BackFiller.Benchmarks.csproj --configuration Release --no-restore

      - name: Build benchmark test project
        run: dotnet build VectorNNTP.BackFiller.Benchmarks.Tests/VectorNNTP.BackFiller.Benchmarks.Tests.csproj --configuration Release --no-restore

      - name: Run benchmark contract tests
        run: >
          dotnet test VectorNNTP.BackFiller.Benchmarks.Tests/VectorNNTP.BackFiller.Benchmarks.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=benchmark-test-results.trx"
          --results-directory ./BenchmarkTestResults

      - name: Upload benchmark test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-benchmark-test-results
          path: BenchmarkTestResults/**/*.trx
          retention-days: 14

  windows-build:
    name: Windows Build Validation
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore VectorNNTP.BackFiller.slnx

      - name: Build production project
        run: dotnet build VectorNNTP.BackFiller/VectorNNTP.BackFiller.csproj --configuration Release --no-restore

      - name: Publish BackFiller win-x64
        run: >
          dotnet publish VectorNNTP.BackFiller/VectorNNTP.BackFiller.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ./artifacts/win-x64
          --no-restore

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: backfiller-win-x64-ci-build
          path: artifacts/win-x64/
          retention-days: 7
